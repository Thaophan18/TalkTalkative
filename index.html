<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ChatEnglish – Học tiếng Anh qua hội thoại</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#ff6fb0"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@400;700;800&family=Be+Vietnam+Pro:wght@400;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff3f8;--card:#fff;--ink:#3d2b4f;--sub:#8d7a9f;--line:#f4d7e6;--ac:#ff6fb0;--acs:#f1e8ff;--me:#ffdcec;--ok:#16a34a;--bad:#e5484d;--hlc:#ffd0e4;--c0:#ffe0ee;--c1:#e4e6ff;--c2:#d7f5e6;--c3:#fff0c9;--c4:#ffe3d6;--c5:#d8f0fb;--sh:#f0c3d9;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1530;--card:#2b2142;--ink:#fbefff;--sub:#bba9d0;--line:#42345f;--ac:#ff7ab6;--acs:#3a2d5c;--me:#5b2c52;--hlc:rgba(255,122,182,.35);--c0:#4a2a52;--c1:#2f3560;--c2:#26493f;--c3:#5a4426;--c4:#4a2f3f;--c5:#2c4559;--sh:#120b20}}
:root[data-theme="dark"]{--bg:#1d1530;--card:#2b2142;--ink:#fbefff;--sub:#bba9d0;--line:#42345f;--ac:#ff7ab6;--acs:#3a2d5c;--me:#5b2c52;--hlc:rgba(255,122,182,.35);--c0:#4a2a52;--c1:#2f3560;--c2:#26493f;--c3:#5a4426;--c4:#4a2f3f;--c5:#2c4559;--sh:#120b20}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg) radial-gradient(var(--line) 1.5px,transparent 1.5px) 0 0/24px 24px;color:var(--ink);font-family:"Nunito","Be Vietnam Pro",system-ui,sans-serif;display:flex;flex-direction:column;max-width:520px;margin:0 auto}
header{display:flex;align-items:center;gap:6px;padding:10px 12px;margin:10px 12px 0;border-radius:22px;background:var(--card);box-shadow:0 4px 0 var(--sh)}
header h1{font:800 19px "Baloo 2","Nunito",sans-serif;margin:0;flex:1;color:var(--ac);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.chip{border-radius:99px;padding:5px 10px;font-size:12px;font-weight:800;background:var(--acs);white-space:nowrap}
.chip.on{background:var(--ac);color:#fff}
#home{padding:16px 14px 20px;overflow:auto;flex:1}
.hero{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.mas{font-size:46px;background:var(--card);width:76px;height:76px;border-radius:30px;display:grid;place-items:center;box-shadow:0 4px 0 var(--sh);flex:none}
.hero h2{font:800 22px "Baloo 2",sans-serif;margin:0}
.hero p{margin:0;color:var(--sub);font-size:14px}
.stats{display:flex;gap:8px;margin-bottom:14px}
.stats span{background:var(--card);border-radius:99px;padding:6px 12px;font-weight:800;font-size:13px;box-shadow:0 3px 0 var(--sh)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.lesson{position:relative;text-align:left;border-radius:24px;padding:14px 12px 14px;min-height:132px;display:flex;flex-direction:column;box-shadow:0 5px 0 var(--sh);transition:transform .12s}
.lesson:active{transform:translateY(3px);box-shadow:0 2px 0 var(--sh)}
.lesson i{font-style:normal;font-size:32px;line-height:1}
.lesson b{font:800 16px/1.2 "Baloo 2",sans-serif;margin-top:8px}
.lesson span{color:var(--sub);font-size:12px;margin-top:3px}
.lesson em{position:absolute;top:10px;right:10px;background:var(--ok);color:#fff;border-radius:50%;width:24px;height:24px;display:grid;place-items:center;font-style:normal;font-size:13px;font-weight:800}
.c0{background:var(--c0)}.c1{background:var(--c1)}.c2{background:var(--c2)}.c3{background:var(--c3)}.c4{background:var(--c4)}.c5{background:var(--c5)}
#chat{flex:1;overflow:auto;padding:14px;display:none;flex-direction:column;gap:12px}
.row{display:flex;align-items:flex-end;gap:8px}
.row.me{justify-content:flex-end}
.av{width:36px;height:36px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:20px;flex:none;box-shadow:0 3px 0 var(--sh)}
.b{background:var(--card);border-radius:22px 22px 22px 6px;padding:10px 14px;max-width:82%;text-align:left;box-shadow:0 3px 0 var(--sh);animation:pop .22s ease-out}
.row.me .b{background:var(--me);border-radius:22px 22px 6px 22px}
.en{font-weight:800;font-size:16px;line-height:1.35}
.vi{font-size:13.5px;color:var(--sub);margin-top:2px}
.nov .vi{display:none}
.lv{display:inline-block;background:#a78bfa;color:#fff;font-size:10px;font-weight:800;border-radius:99px;padding:1px 8px;margin-left:6px;vertical-align:middle}
.hl{background:linear-gradient(transparent 58%,var(--hlc) 58%);cursor:pointer}
@keyframes pop{from{transform:scale(.9);opacity:0}}
@media (prefers-reduced-motion:reduce){.b{animation:none}.lesson{transition:none}}
#panel,#cz{display:none;background:var(--card);margin:0 10px 10px;border-radius:28px;padding:14px;box-shadow:0 5px 0 var(--sh)}
.hint{font:800 14px "Baloo 2",sans-serif;margin-bottom:8px;color:var(--ac)}
.hint i::before{content:"✨ ";font-style:normal}
.sug{background:var(--acs);border-radius:20px;padding:12px;display:flex;gap:8px;align-items:center}
.sug .t{flex:1}
.round{width:44px;height:44px;border-radius:50%;background:#a78bfa;color:#fff;font-size:18px;flex:none;box-shadow:0 4px 0 #7c5fe0}
#mic{background:var(--ac);box-shadow:0 4px 0 #d9468f}
.round:active{transform:translateY(3px);box-shadow:none}
.round.rec{background:var(--bad);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.1)}}
.tag{font-size:12px;color:var(--sub);margin-top:4px}
.acts{display:flex;gap:8px;margin-top:10px}
.send{flex:1;background:var(--ac);color:#fff;border-radius:18px;padding:12px;font-weight:800;font-size:15px;box-shadow:0 4px 0 #d9468f}
.send:active{transform:translateY(3px);box-shadow:none}
.alt{width:100%;text-align:left;background:var(--bg);border-radius:16px;padding:8px 12px;margin-top:6px}
#alts{display:none}
.more{font-size:13px;font-weight:800;margin-top:10px;color:var(--sub)}
#res{font-size:14px;margin-top:8px}
#res .w.ok{color:var(--ok)}#res .w.x{color:var(--bad);text-decoration:underline wavy}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:8px 16px;border-radius:99px;font-size:13px;font-weight:700;display:none;max-width:90%}
#vocab{display:none;position:fixed;inset:0;background:var(--bg);z-index:5;max-width:520px;margin:0 auto;padding:16px;overflow:auto}
#vocab h2{margin:12px 0;font:800 22px "Baloo 2",sans-serif}
.v{background:var(--card);border-radius:18px;padding:10px 12px;margin-bottom:8px;display:flex;justify-content:space-between;gap:8px;box-shadow:0 3px 0 var(--sh)}
.flt{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:4px}
#mode{display:none;position:fixed;inset:0;background:rgba(40,20,60,.45);z-index:6;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:28px 28px 0 0;padding:18px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h3{font:800 20px "Baloo 2",sans-serif;margin:0 0 12px}
.mb{display:block;width:100%;text-align:left;background:var(--acs);border-radius:20px;padding:14px;margin-bottom:10px;font:800 17px "Baloo 2",sans-serif;box-shadow:0 4px 0 var(--sh)}
.mb span{display:block;font:400 12.5px Nunito,sans-serif;color:var(--sub)}
#czIn{width:100%;font:800 17px Nunito,sans-serif;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:16px;padding:11px 14px;outline:none}
#czIn:focus{border-color:var(--ac)}
#czMsg{font-size:13px;margin-top:6px;color:var(--sub);min-height:18px}
.bk{display:inline-block;min-width:70px;border-bottom:3px dashed var(--ac);text-align:center;color:var(--ac)}
#cz .chip{padding:10px 12px}
</style>
</head>
<body>
<header>
  <button id="back" class="chip" style="display:none" aria-label="Quay lại">‹ Về</button>
  <h1 id="ttl">ChatEnglish 🐰</h1>
  <button id="tv" class="chip on">🇻🇳 Dịch</button>
  <button id="vb" class="chip">⭐ <span id="vc">0</span></button>
</header>

<div id="home"></div>
<div id="chat" aria-live="polite"></div>
<div id="panel">
  <div class="hint"><i></i>Chạm mic để luyện nói</div>
  <div class="sug">
    <div class="t"><div class="en" id="sEn"></div><div class="vi" id="sVi"></div><div class="tag" id="sTag"></div></div>
    <button class="round" id="spk" aria-label="Nghe">🔊</button>
    <button class="round" id="mic" aria-label="Luyện nói">🎤</button>
  </div>
  <div id="res"></div>
  <div class="acts"><button class="send" id="send">Gửi tin nhắn</button></div>
  <button class="more" id="more">Một vài cách khác ⌄</button>
  <div id="alts"></div>
</div>
<div id="cz"><div class="hint"><i></i>Điền cụm còn thiếu</div><div class="tag" id="czVi" style="margin:0 0 8px"></div><input id="czIn" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Gõ cụm từ…"><div class="acts"><button class="send" id="czOk">Kiểm tra</button><button class="chip" id="czHint">💡 Gợi ý</button><button class="chip" id="czSk">Đáp án</button></div><div id="czMsg"></div></div>
<div id="mode"><div class="sheet"><h3 id="mT"></h3><button class="mb" data-m="chat">💬 Hội thoại<span>Đọc, nghe và luyện nói câu trả lời</span></button><button class="mb" data-m="cloze">✏️ Điền từ<span>Điền cụm cần học ở cả hai vai</span></button><button class="chip" id="mX">Đóng</button></div></div>
<div id="toast"></div>
<div id="vocab"><button class="chip" id="vx">‹ Đóng</button><h2>Từ vựng đã lưu</h2><div id="vl"></div></div>

<script>
/* ===== BÀI HỌC: thêm bài mới ngay trong khối này ===== */
// Thêm bài mới: copy một khối {id,t,d,s:[...]} rồi đổi nội dung.
// T = người kia nói (lv: A2/B1, hl: cụm gạch chân để lưu từ vựng), M = bạn nói, C = lượt bạn luyện nói + các cách khác.
const T=(en,vi,lv,hl)=>({w:"them",en,vi,lv,hl});
const M=(en,vi)=>({w:"me",en,vi});
const C=(en,vi,tag,...alts)=>({c:1,en,vi,tag,alts:alts.map(([en,vi])=>({en,vi}))});
const L=[
{id:1,t:"Nhớ nhau",d:"Nhắn tin tán tỉnh · A2–B1",s:[
 T("I miss you","em nhớ chị rồi","A2",["miss you"]),
 T("Why aren't you replying?","sao ơ rep","A2",["replying"]),
 T("Can I pick you up tonight and kiss your cheek?","tối đón cho thơm má ơ?","B1",["pick you up"]),
 C("What if I don't let you? :))","Không cho thì sao? :))","Hơi trêu, flirt, đúng vibe nhất.",["Sure, but only if you bring snacks.","Được, nhưng phải mang đồ ăn vặt."],["I'm not sure. Maybe I'm busy tonight.","Chưa chắc nữa. Tối nay có thể chị bận."],["I miss you too. Come pick me up.","Chị cũng nhớ em. Qua đón chị đi."]),
 T("Then I'll steal one anyway.","thế em vẫn trộm một cái.","B1",["steal"])]},
{id:2,t:"Gọi cà phê",d:"Quán cà phê · A1–A2",s:[
 T("Hi! What can I get for you?","Chào bạn! Bạn muốn dùng gì?","A2",["What can I get for you"]),
 C("Can I have a latte, please?","Cho mình một ly latte nhé?","Lịch sự và tự nhiên.",["I'd like an iced coffee.","Mình muốn một ly cà phê đá."],["Just a small black coffee, please.","Chỉ một ly cà phê đen nhỏ thôi."]),
 T("Sure. Would you like it hot or iced?","Được ạ. Bạn muốn nóng hay đá?","A2",["hot or iced"]),
 C("Iced, please. And no sugar.","Đá nhé. Và không đường.","Nói rõ yêu cầu.",["Hot, please. Thanks!","Nóng nhé. Cảm ơn!"]),
 T("That's five dollars. Cash or card?","Năm đô ạ. Tiền mặt hay thẻ?","A2",["Cash or card"]),
 C("Card, please.","Thẻ nhé.","Ngắn gọn là đủ.",["I'll pay by card.","Mình trả bằng thẻ."])]},
{id:3,t:"Làm quen bạn mới",d:"Gặp lần đầu · A2–B1",s:[
 T("Hey, I don't think we've met. I'm Sam.","Chào, hình như mình chưa gặp. Mình là Sam.","B1",["we've met"]),
 C("Nice to meet you, Sam! I'm new here.","Rất vui được gặp bạn, Sam! Mình mới đến đây.","Câu chào chuẩn.",["Hi Sam! I just moved to the city.","Chào Sam! Mình mới chuyển đến thành phố."]),
 T("Cool! What do you do for fun?","Hay quá! Bạn thích làm gì lúc rảnh?","A2",["for fun"]),
 C("I love hiking and trying new food.","Mình thích đi bộ đường dài và thử món mới.","Chia sẻ sở thích.",["Mostly I watch movies at home.","Chủ yếu mình xem phim ở nhà."]),
 T("Same! We should hang out sometime.","Giống mình! Hôm nào đi chơi nhé.","B1",["hang out"])]},
{id:4,t:"Chào hỏi như người bản xứ",d:"What's up, long time no see · A2",s:[
 T("Hey! What's up?","Ê! Dạo này sao rồi?","A2",["What's up"]),
 C("Not much. How about you?","Không có gì nhiều. Còn bạn?","Câu trả lời quen thuộc nhất.",["Just chilling. You?","Đang thư giãn thôi. Còn bạn?"],["Pretty good, thanks!","Khá ổn, cảm ơn!"]),
 T("Same here. Long time no see!","Mình cũng vậy. Lâu rồi không gặp!","A2",["Long time no see"]),
 C("I know, right? It's been ages!","Đúng không? Lâu lắm rồi!","It's been ages = lâu lắm rồi.",["Yeah, we should catch up soon.","Ừ, mình nên gặp nhau nói chuyện sớm."]),
 T("Totally. Anyway, I gotta run. Talk later!","Chuẩn luôn. Thôi mình phải đi đây. Nói chuyện sau!","B1",["I gotta run"]),
 C("Sure thing. Take care!","Được thôi. Giữ gìn nhé!","Cách tạm biệt thân thiện.",["See you around!","Hẹn gặp lại!"])]},
{id:5,t:"Rủ đi chơi",d:"Hẹn bạn bè · A2–B1",s:[
 T("Are you free this Saturday?","Thứ Bảy này bạn rảnh không?","A2",["free this Saturday"]),
 C("I think so. What's the plan?","Chắc là rảnh. Có kế hoạch gì?","Hỏi lại tự nhiên.",["Maybe. Why, what's up?","Có thể. Sao vậy?"]),
 T("Wanna grab dinner and catch a movie?","Đi ăn tối rồi xem phim không?","B1",["Wanna grab dinner","catch a movie"]),
 C("Sounds great! Count me in.","Nghe hay đó! Tính mình vào nhé.","Count me in = cho mình tham gia.",["I'd love to, but I'm swamped this weekend.","Mình muốn lắm, nhưng cuối tuần này bận ngập đầu."]),
 T("Awesome! I'll text you the details.","Tuyệt! Mình nhắn chi tiết cho bạn nhé.","A2",["text you"]),
 C("Perfect. Can't wait!","Tuyệt. Mong quá!","",["Cool, see you then!","Ok, hẹn gặp!"])]},
{id:6,t:"Ở công ty",d:"Đồng nghiệp & deadline · B1",s:[
 T("Morning! Did you get a chance to look at the report?","Chào buổi sáng! Bạn đã xem báo cáo chưa?","B1",["get a chance to"]),
 C("Not yet, I've been swamped. I'll get to it this afternoon.","Chưa, mình bận ngập đầu. Chiều nay mình sẽ xem.","I'll get to it = mình sẽ làm.",["Yes, I just sent you my notes.","Rồi, mình vừa gửi ghi chú cho bạn."]),
 T("No rush. Just keep me posted.","Không gấp đâu. Cứ cập nhật cho mình nhé.","B1",["keep me posted"]),
 C("Will do. Thanks for being flexible!","Được. Cảm ơn bạn đã linh hoạt!","Will do = sẽ làm.",["Got it. I'll let you know.","Hiểu rồi. Mình sẽ báo bạn."]),
 T("By the way, are you joining the team lunch?","À này, bạn đi ăn trưa với team không?","B1",["By the way"]),
 C("Yeah, I'm in. Where are we going?","Có, mình đi. Mình đi đâu?","",["I can't, I have a meeting.","Mình không đi được, mình có họp."])]},
{id:7,t:"Đi xe & hỏi đường",d:"Taxi, Uber · A2–B1",s:[
 T("Hi, are you Alex? I'm your driver.","Chào, bạn là Alex phải không? Tôi là tài xế.","A2",["your driver"]),
 C("Yes, that's me. Thanks for coming!","Vâng, là tôi. Cảm ơn đã đến!","",["Yep! Can you take me to the airport?","Vâng! Bạn chở tôi ra sân bay nhé?"]),
 T("No problem. Traffic looks heavy, though.","Không sao. Nhưng đường có vẻ đông.","A2",["Traffic looks heavy"]),
 C("That's okay. How long will it take?","Không sao. Mất bao lâu?","",["Can we take a faster route?","Mình đi đường nhanh hơn được không?"]),
 T("About 30 minutes. You can sit back and relax.","Khoảng 30 phút. Bạn cứ thư giãn nhé.","B1",["sit back and relax"]),
 C("Great. Could you drop me off right here?","Tốt. Cho tôi xuống ngay đây nhé?","drop me off = cho tôi xuống xe.",["Thanks! Have a nice day.","Cảm ơn! Chúc bạn ngày tốt lành."])]},
{id:8,t:"Ở nhà hàng",d:"Đặt bàn, gọi món, tính tiền · A2–B1",s:[
 T("Welcome! Do you have a reservation?","Chào mừng! Bạn có đặt bàn chưa?","A2",["a reservation"]),
 C("No, a table for two, please.","Chưa, cho một bàn hai người.","",["Yes, under the name Linh.","Có, tên Linh."]),
 T("Are you ready to order, or do you need a few more minutes?","Bạn gọi món chưa, hay cần thêm vài phút?","B1",["ready to order"]),
 C("I'll have the chicken, please. What do you recommend?","Cho mình món gà. Bạn gợi ý món nào?","",["Could we have a few more minutes?","Cho bọn mình thêm vài phút nhé?"]),
 T("Everything good? Can I get you anything else?","Mọi thứ ổn chứ? Bạn cần gì thêm không?","A2",["anything else"]),
 C("We're all set. Could we get the check, please?","Bọn mình đủ rồi. Cho xin hóa đơn nhé?","check (Mỹ) = hóa đơn.",["Could we split the bill?","Bọn mình chia hóa đơn được không?"])]},
{id:9,t:"Xin lỗi & từ chối",d:"My bad, no worries · B1",s:[
 T("Hey, you're late. I've been waiting for twenty minutes.","Này, bạn đến trễ. Mình đợi hai mươi phút rồi.","B1",["been waiting"]),
 C("My bad! The traffic was crazy. I'm so sorry.","Lỗi của mình! Đường kẹt khủng khiếp. Xin lỗi nhé.","My bad = lỗi của mình (thân mật).",["Sorry, I totally lost track of time.","Xin lỗi, mình quên mất thời gian."]),
 T("It's fine. Don't worry about it.","Không sao. Đừng lo.","A2",["Don't worry about it"]),
 C("Thanks for understanding. Let me buy you a coffee.","Cảm ơn bạn thông cảm. Để mình mời cà phê.","",["I owe you one!","Mình nợ bạn một lần!"]),
 T("Deal. Hey, can you lend me some cash? I forgot my wallet.","Chốt. À, cho mình mượn ít tiền được không? Mình quên ví.","B1",["lend me"]),
 C("I'd love to help, but I'm a bit short this week.","Mình muốn giúp lắm, nhưng tuần này hơi hụt tiền.","Từ chối nhẹ nhàng.",["Sure, no worries. How much do you need?","Được, không sao. Bạn cần bao nhiêu?"])]},
{id:10,t:"Nhắn tin & slang",d:"omg, brb, ttyl · B1",s:[

$("tv").onclick=()=>{$("tv").classList.toggle("on");document.body.classList.toggle("nov",!$("tv").classList.contains("on"))};
$("back").onclick=()=>{try{speechSynthesis.cancel()}catch(e){}run++;idx=99;blank=null;cur={s:[]};home()};
$("vb").onclick=()=>{$("vl").innerHTML=vocab.length?vocab.map(v=>`<div class="v"><div><b>${v.p}</b><div class="vi">${v.s}<br>${v.vi}</div></div><button class="chip" onclick="say('${v.p.replace(/'/g,"\\'")}')">🔊</button></div>`).join(""):'<p style="color:var(--sub)">Chưa có từ nào. Chạm vào cụm gạch chân trong tin nhắn để lưu.</p>';$("vocab").style.display="block"};
$("vx").onclick=()=>$("vocab").style.display="none";
$("vc").textContent=vocab.length;if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
home();
</script>
</body>
</html>
